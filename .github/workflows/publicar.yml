# Monta a REDIA e publica no GitHub Pages a cada push na branch main.
# Conexão com o Supabase: Settings › Secrets and variables › Actions › aba "Variables":
#   SUPABASE_URL, SUPABASE_ANON_KEY (chave pública anon/publishable) e, opcionais, REDIA_EMAIL_DOMINIO
#   e REDIA_SEM_EXEMPLO=1 (publica sem os dados de exemplo).
# Sem essas variáveis, o site publicado abre em modo demonstração.
name: Publicar no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Montar o app
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          REDIA_EMAIL_DOMINIO: ${{ vars.REDIA_EMAIL_DOMINIO }}
          REDIA_SEM_EXEMPLO: ${{ vars.REDIA_SEM_EXEMPLO }}
        run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  publicar:
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
