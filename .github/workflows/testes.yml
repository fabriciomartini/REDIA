# Testes automatizados: SQL/RLS, cadastro de usuários, ponta a ponta (demonstração e nuvem simulada) e telas móveis.
# Roda em pull requests e sob demanda (Actions › Testes › Run workflow). Não bloqueia a publicação.
name: Testes
on:
  pull_request:
  workflow_dispatch:
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run todos
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-de-tela
          path: tests/out
